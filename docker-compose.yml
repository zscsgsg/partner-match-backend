version: "3.8"

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: partner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      MYSQL_DATABASE: course
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/java/com/zsc/partnermatch/sql/course.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - partner-net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: partner-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456}
    volumes:
      - redis-data:/data
    networks:
      - partner-net

  # ==================== 应用 ====================
  app:
    build: .
    container_name: partner-app
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: course
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      - mysql
      - redis
    networks:
      - partner-net

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: partner-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - partner-net

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: partner-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - partner-net

  # ==================== Nginx（前端） ====================
  nginx:
    image: nginx:alpine
    container_name: partner-nginx
    restart: unless-stopped
    ports:
      - "9999:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./zsc-partner-match/dist:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - partner-net

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  partner-net:
    driver: bridge
