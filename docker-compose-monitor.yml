version: "3.8"

services:
  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: partner-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus-local.yml:/etc/prometheus/prometheus.yml
    networks:
      - partner-net

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: partner-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    depends_on:
      - prometheus
    networks:
      - partner-net

networks:
  partner-net:
    driver: bridge
