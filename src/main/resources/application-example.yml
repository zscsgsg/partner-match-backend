spring:
  application:
    name: partner-match-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:course}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
      database: 2
  session:
    timeout: 86400
    store-type: redis

  # ===== Spring AI Alibaba DashScope 配置 =====
  ai:
    dashscope:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

server:
  port: 8083
  reactive:
    session:
      cookie:
        domain: localhost

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  mapper-locations: classpath:/mapper/**.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ============================================================
# 环境变量说明（请在系统环境变量或 .env 文件中设置以下变量）
# ============================================================
# DB_HOST       - MySQL 主机地址（默认 localhost）
# DB_PORT       - MySQL 端口（默认 3306）
# DB_NAME       - MySQL 数据库名（默认 course）
# DB_USERNAME   - MySQL 用户名（默认 root）
# DB_PASSWORD   - MySQL 密码（必填，无默认值）
# REDIS_HOST    - Redis 主机地址（默认 localhost）
# REDIS_PORT    - Redis 端口（默认 6379）
# REDIS_PASSWORD- Redis 密码（必填，无默认值）
# AI_API_KEY    - 阿里云百炼 DashScope API Key（必填）
